<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Corrosion Labs</title>
  <style>
    @font-face {
      font-family: "Blogger Sans-Light";
      src: url("fonts/Blogger Sans-Light.ttf") format("truetype");
      font-display: swap;
    }

    @font-face {
      font-family: "Terminal F4";
      src: url("fonts/Terminal F4.ttf") format("truetype");
      font-display: swap;
    }

    html, body {
      width: 100%;
      min-height: 100%;
      margin: 0;
    }

    body {
      display: grid;
      min-height: 100vh;
      place-items: start center;
      overflow: hidden;
      background: #c1c1c1;
      cursor: pointer;
      transition: opacity 0.5s ease;
    }

    body.is-exiting { opacity: 0; }

    @keyframes corrosion-drop {
      0% { transform: translateY(-110vh); }
      75% { transform: translateY(0); }
      84% { transform: translateY(-15px); }
      100% { transform: translateY(0); }
    }

    @keyframes corrosion-fade-in {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    .hero {
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 100%;
      max-width: 100%;
      gap: 0;
    }

    .hero img {
      display: block;
      width: auto;
      height: auto;
      max-width: min(900px, calc(100vw - 2rem));
      max-height: 65vh;
      object-fit: contain;
      animation: corrosion-drop 1.6s ease-out both;
    }

    .hero p {
      max-width: 100%;
      margin: 0.5rem 0 0;
      color: #303030;
      font-family: "Blogger Sans-Light", sans-serif;
      font-size: clamp(0.9rem, 2vw, 1.25rem);
      text-align: center;
      opacity: 0;
      animation: corrosion-fade-in 1.2s ease-out 2.8s forwards;
    }

    .hero h1 {
      max-width: 100%;
      margin: 1.5rem 0 0;
      color: #303030;
      font-family: "Terminal F4", sans-serif;
      font-size: clamp(1.4rem, 4vw, 2.2rem);
      font-weight: 400;
      text-align: center;
      opacity: 0;
      animation: corrosion-fade-in 1.2s ease-out 1.6s forwards;
    }

    @media (prefers-reduced-motion: reduce) {
      body { transition: none; }

      .hero img,
      .hero h1,
      .hero p {
        opacity: 1;
        transform: none;
        animation: none;
      }
    }
  </style>
</head>
<body>
  <main class="hero">
    <img src="img/site/backgrounds/cabe.jpg" alt="">
    <h1>CORROSION LABS</h1>
    <p>Nous rendons l'inquiétant fonctionnel.</p>
  </main>
  <script>
    (() => {
      let hasEntered = false;
      const reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
      const autoEntry = window.setTimeout(startEntry, 8000);

      function startEntry() {
        if (hasEntered) {
          return;
        }

        hasEntered = true;
        window.clearTimeout(autoEntry);

        if (reduceMotion) {
          window.location.href = "corrosion-labs.html";
          return;
        }

        document.body.classList.add("is-exiting");
        window.setTimeout(() => {
          window.location.href = "corrosion-labs.html";
        }, 500);
      }

      document.addEventListener("click", startEntry);
      document.addEventListener("keydown", (event) => {
        if (event.key === "Enter" || event.key === " ") {
          event.preventDefault();
          startEntry();
        }
      });
    })();
  </script>
</body>
</html>
